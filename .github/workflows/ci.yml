name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Add Windows GNU target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build release workspace
        run: cargo build --workspace --release

  cross-sdk-and-scripts:
    name: Cross-language parity & config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install Node dependencies
        run: npm ci
      - name: Verify JS/TS/Python/Go parity & SDK unit tests
        run: |
          node tests/cross_language/verify_parity.mjs
          npx tsx tests/cross_language/verify_parity.ts
          python3 tests/cross_language/verify_parity.py
          go -C tests/cross_language run .
          go -C sdks/go build ./...
          go -C examples/go build ./...
          node --test tests/cross_language/sdk_parity.test.mjs tests/explorer/integrity_and_crypto.test.mjs
          python3 -m unittest discover -s tests/cross_language -p "test_*.py"
      - name: Validate Next.js Explorer TypeScript, Lint, and Build
        run: |
          ./node_modules/.bin/tsc --noEmit
          npm run lint
          npm run build
      - name: Validate shell scripts syntax
        run: |
          for s in scripts/*.sh tests/cross_language/*.sh tests/e2e/*.sh tests/multi_node/*.sh; do
            bash -n "$s"
          done
      - name: Validate config TOML manifests
        run: |
          python3 -c 'import glob, tomllib; [tomllib.load(open(p, "rb")) for p in glob.glob("config/*.toml")]'