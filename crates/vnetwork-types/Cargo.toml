[package]
name = "vnetwork-types"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Canonical types, identifiers, identities, 3D token vectors, commitments, and consensus models for Vector Network."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
blake3 = "1"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

