name: One-time Rust workspace formatting

on:
  push:
    branches:
      - fix/reject-unbound-consensus-proposals

permissions:
  contents: write

concurrency:
  group: rustfmt-workspace-repair
  cancel-in-progress: false

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install stable Rust formatter
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatted Rust sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Workspace already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply rustfmt across workspace [rustfmt-bot]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
