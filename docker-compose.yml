services:
  atlas-node:
    build: .
    container_name: atlas-vector-node
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - ATLAS_DATA_DIR=/app/data
      - ATLAS_ADMIN_TOKEN=${ATLAS_ADMIN_TOKEN:-}
      - ATLAS_KEYSTORE_PASSPHRASE=${ATLAS_KEYSTORE_PASSPHRASE:-}
    volumes:
      - atlas_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  atlas_data:
