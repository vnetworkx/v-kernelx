# Vector Network Node Configuration Example
# Separate secrets (keys) from public configuration; pass secret key files or env vars securely.

network_id = "vector-testnet-1"
network_name = "Vector Testnet"
profile = "TESTNET" # DEVELOPMENT | TESTNET | PRODUCTION
protocol_version = "vector-network/1.0.0"

node_name = "vn-node-1"
node_kind = "FULL_NODE" # LIGHT_PARTICIPANT | FULL_NODE | VALIDATOR_NODE | BOOTSTRAP_SEED
enable_p2p = true
enable_public_api = true
enable_validator = false
enable_relay_server = false

# Public & P2P addresses
p2p_listen_addresses = ["/ip4/0.0.0.0/tcp/7001"]
advertised_addresses = ["/dns4/node1.vectornetwork.example/tcp/7001"]
bootstrap_peers = [
  "/dns4/seed1.vectornetwork.example/tcp/7001/p2p/<SEED_PEER_ID>",
  "/dns4/seed2.vectornetwork.example/tcp/7001/p2p/<SEED_PEER_ID>"
]
discovery_mode = "hybrid" # kademlia | bootstrap | hybrid

public_api_bind = "0.0.0.0:8080"
public_api_url = "https://rpc.vectornetwork.example"
storage_path = "/var/lib/vnetwork/node1"
node_identity_path = "/var/lib/vnetwork/node1/node.key.json"
validator_key_path = "/var/lib/vnetwork/node1/validator.key.json"
quorum_threshold_bps = 6667

[tls]
enabled = false
cert_path = ""
key_path = ""
terminated_by_reverse_proxy = false

