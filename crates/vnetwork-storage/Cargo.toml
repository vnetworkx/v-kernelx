[package]
name = "vnetwork-storage"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Durable persistent storage, fsynced event WAL, atomic snapshots, indexing, and crash recovery for Vector Network."

[dependencies]
vnetwork-types = { path = "../vnetwork-types" }
vnetwork-core = { path = "../vnetwork-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
