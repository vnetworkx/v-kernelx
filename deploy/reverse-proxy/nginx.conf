events {
    worker_connections 1024;
}

http {
    upstream vnetwork_api {
        server bootstrap-seed:8080;
    }

    server {
        listen 443 ssl http2;
        server_name rpc.vectornetwork.example;

        ssl_certificate /etc/ssl/vnetwork/fullchain.pem;
        ssl_certificate_key /etc/ssl/vnetwork/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 2m;

        location /v1/ws {
            proxy_pass http://vnetwork_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://vnetwork_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
