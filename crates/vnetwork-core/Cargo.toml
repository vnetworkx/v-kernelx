[package]
name = "vnetwork-core"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Authoritative Vector Network protocol engine, entity state machine, language verification, replay, and reconstruction."

[dependencies]
vnetwork-types = { path = "../vnetwork-types" }
v-langx = { path = "../../vendor/vectorspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }

