name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Every PR push creates a new head. Cancel obsolete queued/running matrices so
# the newest source revision, not a backlog of superseded commits, is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - name: Add Windows GNU target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.7.5

      - name: Format check
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build release workspace
        run: cargo build --workspace --release

  cross-sdk-and-scripts:
    name: Cross-language parity & config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: "22"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: latest
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.11"
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.2.0
        with:
          go-version: "1.22"
          cache: false
      - name: Install Node dependencies from bun.lock
        run: bun install --frozen-lockfile
      - name: Verify JS/TS/Python/Go parity & SDK unit tests
        run: |
          node tests/cross_language/verify_parity.mjs
          bun tests/cross_language/verify_parity.ts
          python3 tests/cross_language/verify_parity.py
          go -C tests/cross_language run .
          go -C sdks/go test ./...
          go -C sdks/go build ./...
          go -C examples/go build ./...
          ./node_modules/.bin/tsc -p sdks/typescript/tsconfig.json --noEmit
          node --test tests/cross_language/sdk_parity.test.mjs tests/explorer/integrity_and_crypto.test.mjs
          python3 -m unittest discover -s tests/cross_language -p "test_*.py"
      - name: Validate Next.js Explorer TypeScript, Lint, and Build
        run: |
          ./node_modules/.bin/tsc --noEmit
          npm run lint
          npm run build
      - name: Validate VectorSpace parity, shell scripts syntax & safety
        run: |
          bash scripts/sync-vectorspace.sh --check
          for s in scripts/*.sh tests/cross_language/*.sh tests/e2e/*.sh tests/multi_node/*.sh; do
            bash -n "$s"
          done
          bash tests/e2e/script_safety.test.sh
      - name: Validate config TOML manifests
        run: |
          python3 -c 'import glob, tomllib; [tomllib.load(open(p, "rb")) for p in glob.glob("config/*.toml")]'