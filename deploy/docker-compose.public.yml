services:
  bootstrap-seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
    restart: unless-stopped
    environment:
      NETWORK_PROFILE: PRODUCTION
      NETWORK_ID: ${NETWORK_ID:-vector-main}
      NETWORK_PROTOCOL_VERSION: vector-network/1.0.0
      NETWORK_NODE_KIND: BOOTSTRAP_SEED
      NETWORK_ENABLE_VALIDATOR: "false"
      NETWORK_ENABLE_PUBLIC_API: "true"
      NETWORK_API_LISTEN_ADDR: 0.0.0.0:8080
      NETWORK_P2P_LISTEN_ADDRS: /ip4/0.0.0.0/tcp/9000
      NETWORK_ADVERTISED_ADDRS: ${PUBLIC_P2P_MULTIADDR:-/dns4/bootstrap.vectornetwork.example/tcp/9000}
      NETWORK_STORAGE_PATH: /var/lib/vnetwork/bootstrap
      NETWORK_IDENTITY_PATH: /var/lib/vnetwork/bootstrap-identity.json
      NETWORK_GENESIS_FILE: /etc/vnetwork/genesis.json
      NETWORK_ALLOW_BOOTSTRAP_ATLAS: "false"
    ports:
      - "9000:9000"
      - "127.0.0.1:8080:8080"
    volumes:
      - vnetwork_public_data:/var/lib/vnetwork
      - ./genesis.json:/etc/vnetwork/genesis.json:ro

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - bootstrap-seed
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  vnetwork_public_data:
  caddy_data:
