apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vnetwork-api-ingress
  namespace: vnetwork
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - rpc.vnetwork.example
      secretName: vnetwork-rpc-tls
  rules:
    - host: rpc.vnetwork.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vnetwork-api
                port:
                  number: 8080
