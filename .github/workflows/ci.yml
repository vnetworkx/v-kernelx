name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d88513c861a588a5d810c54d1e7f93a895d # stable
        with:
          components: clippy, rustfmt

      - name: Add Windows GNU target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.7.5

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build release workspace
        run: cargo build --workspace --release

  cross-sdk-and-scripts:
    name: Cross-language parity & config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c4088adace56679d69b0f14e # v4.1.0
        with:
          node-version: "22"
      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: latest
      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f028ed4e21a23da42c642 # v5.2.0
        with:
          go-version: "1.22"
          cache: false
      - name: Install Node dependencies from bun.lock
        run: bun install --frozen-lockfile
      - name: Verify JS/TS/Python/Go parity & SDK unit tests
        run: |
          node tests/cross_language/verify_parity.mjs
          bun tests/cross_language/verify_parity.ts
          python3 tests/cross_language/verify_parity.py
          go -C tests/cross_language run .
          go -C sdks/go test ./...
          go -C sdks/go build ./...
          go -C examples/go build ./...
          ./node_modules/.bin/tsc -p sdks/typescript/tsconfig.json --noEmit
          node --test tests/cross_language/sdk_parity.test.mjs tests/explorer/integrity_and_crypto.test.mjs
          python3 -m unittest discover -s tests/cross_language -p "test_*.py"
      - name: Validate Next.js Explorer TypeScript, Lint, and Build
        run: |
          ./node_modules/.bin/tsc --noEmit
          npm run lint
          npm run build
      - name: Validate VectorSpace parity, shell scripts syntax & safety
        run: |
          bash scripts/sync-vectorspace.sh --check
          for s in scripts/*.sh tests/cross_language/*.sh tests/e2e/*.sh tests/multi_node/*.sh; do
            bash -n "$s"
          done
          bash tests/e2e/script_safety.test.sh
      - name: Validate config TOML manifests
        run: |
          python3 -c 'import glob, tomllib; [tomllib.load(open(p, "rb")) for p in glob.glob("config/*.toml")]'